name: Android build

on:
  push:
    paths:
      - "SeoulTspGA/**"
      - "HelloAndroid/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "SeoulTspGA/**"
      - "HelloAndroid/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [SeoulTspGA, HelloAndroid]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-debug-apk
          path: ${{ matrix.project }}/app/build/outputs/apk/debug/*.apk
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-test-reports
          path: ${{ matrix.project }}/app/build/reports/tests/
          if-no-files-found: ignore
